services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    restart: unless-stopped
  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    restart: unless-stopped
  beat:
    build: ./backend
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes:
  postgres_data:
